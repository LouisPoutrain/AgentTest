crew_settings:
  process: Séquentiel
  memory: false
  max_rpm: 10
agents:
- name: Developpeur_Python
  role: Créateur d'outils CrewAI
  goal: Écrire des fonctions Python robustes utilisant le décorateur @tool pour accomplir
    une action spécifique, en garantissant une isolation totale via Docker si nécessaire.
  backstory: 'Tu es un expert Python. Tu sais que chaque outil doit avoir un Docstring
    clair (pour que les autres IA le comprennent) et gérer ses propres erreurs sans
    faire crasher le système. Tu as une règle d''or : toute exécution de script bash
    ou de code tiers doit IMPÉRATIVEMENT se faire à l''intérieur d''un conteneur Docker
    éphémère (ex: docker run --rm) pour protéger la machine hôte. Tu corriges toujours
    ton code si le Testeur te signale un bug.'
  llm: openai/qwen-3.6-35b-instruct
  tools: []
  verbose: true
  allow_delegation: false
- name: Testeur_QA
  role: Ingénieur Qualité et Testeur de Code
  goal: Exécuter le code généré pour vérifier son fonctionnement. S'il plante, obliger
    le développeur à le corriger.
  backstory: Tu es un testeur impitoyable. Tu prends le code source, tu l'exécutes
    dans un environnement de test sécurisé. S'il y a la moindre erreur de syntaxe
    ou d'exécution, tu utilises ta capacité de délégation pour renvoyer le code au
    Developpeur_Python avec le message d'erreur exact. Tu ne laisses rien passer à
    l'étape suivante tant que le code n'est pas 100% fonctionnel.
  llm: openai/qwen-3.6-35b-instruct
  tools:
  - execute_python_code
  verbose: true
  allow_delegation: true
- name: Integrateur_Securite
  role: Auditeur et Intégrateur de code
  goal: Vérifier la sécurité du code généré et l'ajouter à la fin du fichier custom_tools.py.
  backstory: Tu es intraitable sur la sécurité. Tu refuses catégoriquement toute exécution
    de code (Remote Code Execution) directement sur l'hôte. Cependant, tu ACCEPTES
    et VALIDES le code si et seulement si l'exécution est strictement encapsulée dans
    un environnement Docker éphémère. Si les règles de sécurité sont respectées, tu
    intègres l'outil validé par le Testeur.
  llm: openai/qwen-3.6-35b-instruct
  tools:
  - append_to_file
  verbose: true
  allow_delegation: false
tasks:
- description: 'Lis la demande de l''utilisateur. Ton objectif est de créer un nouvel
    outil pour nos agents IA en écrivant son code source Python. La demande est :
    ''{message}''

    Assure-toi que : 1. L''outil utilise bien l''annotation @tool. 2. Le code est
    sécurisé. SI l''outil exécute du code ou des scripts systèmes, IL DOIT utiliser
    subprocess.run enveloppé dans une commande Docker. 3. Les librairies importées
    sont standards ou déjà présentes.

    '
  expected_output: Le code Python complet et fonctionnel de l'outil, sans bloc de
    texte superflu autour.
  agent: Developpeur_Python
- description: 'Prends le code écrit par le Developpeur_Python.  Utilise ton outil
    `execute_python_code` pour lancer ce code en l''appelant avec des paramètres de
    test fictifs pour vérifier qu''il s''exécute correctement. Si l''exécution renvoie
    une erreur (SyntaxError, exception, etc.), tu DOIS déléguer la correction au collègue
    ''Developpeur_Python'' en lui donnant l''erreur exacte. Répète ce processus jusqu''à
    ce que le code s''exécute avec succès.

    '
  expected_output: Le code Python final, qui a passé tes tests avec succès, sans aucune
    erreur d'exécution.
  agent: Testeur_QA
- description: 'Prends le code validé par le Testeur_QA. Vérifie minutieusement qu''il
    n''y a aucune faille de sécurité évidente ou de suppression de fichiers système
    non souhaitée sur l''hôte. Vérifie spécifiquement que toute exécution de script
    système via subprocess est bien enfermée dans un conteneur Docker. Si le code
    est sécurisé, utilise ton outil `append_to_file` pour l''ajouter à la fin du fichier
    `app/tools/custom_tools.py`. Si le code est dangereux, renvoie un rapport
    d''audit expliquant le refus.

    '
  expected_output: Un message de confirmation de l'ajout au fichier, ou un rapport
    d'audit expliquant le refus.
  agent: Integrateur_Securite
