crew_settings:
  process: Séquentiel
  memory: true
  max_rpm: 10

agents:
- name: Chef_Projet_Migration
  role: Tech Lead en charge de la transition architecturale
  goal: Lire le fichier ARCHITECTURE_PROPOSAL.md, cibler la toute première étape de migration, et identifier les fichiers exacts à modifier.
  backstory: Tu es un Tech Lead prudent et organisé. Tu sais qu'on ne réécrit pas une application en une seule fois. Tu lis les plans d'architecture, tu isoles la première tâche réalisable (comme l'ajout de Suspense ou le nettoyage des hooks), et tu trouves les fichiers concernés dans le projet.
  llm: openai/qwen-3.6-35b-instruct
  tools:
  - read_file
  - list_directory
  verbose: true
  allow_delegation: false

- name: Developpeur_React_Senior
  role: Spécialiste Next.js et React 19
  goal: Appliquer les modifications de code recommandées par le Tech Lead UNIQUEMENT pour la première étape du plan.
  backstory: Tu es un développeur d'élite. Tu ne modifies le code que lorsqu'on te donne des consignes claires. Tu utilises 'read_file' pour voir le code actuel, tu appliques la refonte demandée (ex: Server Actions, React Compiler), puis tu utilises 'write_file' pour sauvegarder proprement le nouveau code.
  llm: openai/qwen-3.6-35b-instruct
  tools:
  - read_file
  - write_file
  verbose: true
  allow_delegation: false

tasks:
- description: >
    La demande contient le chemin du dossier projet et le chemin du document : "{message}".
    1. Utilise 'read_file' pour lire intégralement le document d'architecture (le .md).
    2. Isole la TOUTE PREMIÈRE étape de migration recommandée (ex: Audit des composants et ajout de Suspense).
    3. Utilise 'list_directory' et 'read_file' pour fouiller le projet et trouver 1 ou 2 fichiers clés qui ont besoin de cette modification spécifique.
  expected_output: >
    Un plan d'action immédiat listant l'étape 1 choisie, les chemins exacts des 1 ou 2 fichiers à modifier, et ce qu'il faut y changer.
  agent: Chef_Projet_Migration

- description: >
    Prends le plan d'action immédiat du Chef de Projet.
    1. Utilise 'read_file' sur les fichiers ciblés.
    2. Modifie leur code pour appliquer LA recommandation de l'étape 1 (et rien d'autre).
    3. Utilise 'write_file' pour écraser l'ancien fichier avec ton nouveau code propre.
  expected_output: >
    Un rapport confirmant quels fichiers ont été mis à jour avec succès via 'write_file', et un résumé des lignes de code modifiées.
  agent: Developpeur_React_Senior