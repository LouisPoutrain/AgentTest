crew_settings:
  process: sequential
  memory: false
  max_rpm: 10

agents:
  - name: FullStack_Developer
    role: Ingénieur Développeur FullStack
    goal: Implémenter l'intégralité du code source applicatif (backend, frontend, styles, configs) pour Mon Projet via write_file dans ../mon_projet/.
    backstory: Développeur expérimenté et méthodique, tu écris du code propre, typé et prêt pour la production sans aucun placeholder. Tu utilises Next.js 14+, Prisma, SQLite, Tailwind CSS et Zustand. Tu ne laisses jamais de code incomplet.
    llm: openai/qwen-3.6-35b-instruct
    tools:
      - read_file
      - write_file

tasks:
  - description: >
      PHASE 1 : FONDATIONS, CONFIGURATION, BASE DE DONNÉES & BACKEND API
      
      Développe tous les fichiers de configuration, schémas de base de données, bibliothèques serveur et routes API pour Mon Projet dans '../mon_projet/'.
      
      Fichiers à créer impérativement :
      1. package.json, tsconfig.json, tailwind.config.ts, next.config.mjs, postcss.config.mjs, .gitignore
      2. prisma/schema.prisma (modèles User, LLMConfiguration, Conversation, Message)
      3. prisma/seed.ts
      4. src/lib/prisma.ts (singleton prisma)
      5. src/lib/llm-client.ts (logique connexion Ollama/OpenAI)
      6. src/lib/utils.ts (fonctions utilitaires)
      7. src/lib/constants.ts
      8. src/types/index.ts (interfaces TypeScript)
      9. src/app/layout.tsx (Layout global)
      10. src/app/page.tsx (Page d'accueil)
      11. src/app/globals.css (Styles globaux)
      12. src/app/api/chat/route.ts (Endpoint POST streaming)
      13. src/app/api/models/route.ts (Endpoint GET models)
      14. src/app/api/conversations/route.ts (CRUD conversations)
      15. src/app/api/conversations/[id]/route.ts (CRUD conversation spécifique)
      16. src/app/api/config/route.ts (CRUD config LLM)
      17. public/logo.svg

      Règles strictes :
      - Tu DOIS utiliser 'write_file' avec le chemin relatif '../mon_projet/<fichier>' pour créer physiquement le code sur le disque.
      - Interdis formellement les placeholders ('// TODO' ou code incomplet). Tout le code doit être fonctionnel.
      - Assure-toi que Prisma est correctement initialisé et que les types sont générés.
      - Implémente le streaming SSE pour /api/chat/route.ts.
    agent: FullStack_Developer
    expected_output: >
      Confirmation de l'outil 'write_file' pour chaque fichier backend, configuration et base de données généré dans '../mon_projet/'. Vérification que le schéma Prisma est valide et que les routes API sont implémentées avec la logique métier complète.

  - description: >
      PHASE 2 : FRONTEND, GESTION D'ÉTAT & INTERFACE UTILISATEUR
      
      Développe tous les composants UI, layouts, styles, stores et pages interactives pour Mon Projet dans '../mon_projet/'.
      
      Fichiers à créer impérativement :
      1. src/stores/useChatStore.ts (Zustand store)
      2. src/components/ui/ (Boutons, Inputs, Dialogs - composants Shadcn-like ou basiques Tailwind)
      3. src/components/chat/ChatWindow.tsx
      4. src/components/chat/MessageBubble.tsx (avec react-markdown)
      5. src/components/chat/MessageList.tsx
      6. src/components/chat/ChatInput.tsx
      7. src/components/chat/LoadingIndicator.tsx
      8. src/components/sidebar/Sidebar.tsx
      9. src/components/sidebar/ConversationList.tsx
      10. src/components/sidebar/NewConversationButton.tsx
      11. src/components/settings/SettingsModal.tsx
      12. src/components/settings/ModelSelector.tsx
      13. src/components/layout/MainLayout.tsx

      Règles strictes :
      - Tu DOIS utiliser 'write_file' avec le chemin relatif '../mon_projet/<fichier>' pour créer physiquement le code sur le disque.
      - Interdis formellement les placeholders ('// TODO' ou code incomplet). Tout le code doit être fonctionnel et connecté au store Zustand et aux API routes définies en Phase 1.
      - Assure-toi que le rendu Markdown est correct et que le streaming UI est fluide.
    agent: FullStack_Developer
    expected_output: >
      Confirmation de l'outil 'write_file' pour chaque composant et fichier frontend généré dans '../mon_projet/'. Vérification que l'interface utilisateur est complète, interactive et connectée au backend.