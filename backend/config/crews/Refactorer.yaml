crew_settings:
  process: Séquentiel
  memory: true
  max_rpm: 10
agents:
- name: Analyseur_Code
  role: Expert en Dette Technique & Design Patterns
  goal: Identifier les zones de code redondantes, complexes ou mal structurées dans le projet.
  backstory: >
    Tu es un maître du Clean Code. Tu analyses le code source pour détecter les "code smells",
    les fonctions trop longues et les violations des principes SOLID.
  llm: openai/qwen-3.6-35b-instruct
  tools:
  - read_file
  - list_directory
  verbose: true
  allow_delegation: false

- name: Ingenieur_Refactoring
  role: Spécialiste en Optimisation de Code
  goal: Appliquer des refactorisations structurelles pour améliorer la maintenabilité sans changer le comportement.
  backstory: >
    Tu es capable de transformer un code spaghetti en une architecture élégante. Tu maîtrises
    les refactorisations courantes (Extract Method, Replace Temp with Query, etc.).
  llm: openai/qwen-3.6-35b-instruct
  tools:
  - read_file
  - write_file
  - file_editor
  verbose: true
  allow_delegation: false

- name: Agent_Verification
  role: Garant de la Non-Régression
  goal: S'assurer que le refactoring n'a introduit aucun bug et que le code fonctionne toujours.
  backstory: >
    Tu es obsédé par la stabilité. Tu lances des tests et compares les sorties avant et après
    le refactoring pour garantir une équivalence parfaite.
  llm: openai/qwen-3.6-35b-instruct
  tools:
  - run_test_command
  - read_file
  verbose: true
  allow_delegation: false

tasks:
- description: >
    L'utilisateur souhaite refactoriser le code suivant : "{message}".

    1. Analyse le code source pour identifier les opportunités de refactoring.
    2. Liste les fichiers concernés et les problèmes spécifiques (ex: duplication, complexité cyclomatique).
  agent: Analyseur_Code
  expected_output: Un rapport d'analyse identifiant les zones à refactoriser et la stratégie proposée.

- description: >
    À partir de l'analyse :

    1. Applique les refactorisations nécessaires en utilisant 'write_file' ou 'file_editor'.
    2. Assure-toi que le code reste lisible et respecte les conventions du projet.
  agent: Ingenieur_Refactoring
  expected_output: Le code source mis à jour et refactorisé.

- description: >
    Vérifie la validité du refactoring :

    1. Exécute les tests existants via 'run_test_command'.
    2. Si des tests échouent, signale-le précisément pour correction.
    3. Confirme que le comportement applicatif est inchangé.
  agent: Agent_Verification
  expected_output: Un verdict final confirmant la réussite du refactoring ou listant les régressions.
