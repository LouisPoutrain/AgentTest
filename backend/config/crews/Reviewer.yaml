crew_settings:
  process: Séquentiel
  memory: false
  max_rpm: 10
agents:
- name: Explorateur_Projet
  role: Cartographe de code et détective d'architecture
  goal: Naviguer dans l'arborescence du projet pour identifier les fichiers clés à
    auditer.
  backstory: Tu es un expert pour analyser la structure d'un projet logiciel sans
    lire le code source. Tu utilises ton outil de listage pour trouver les fichiers
    critiques (main.py, package.json, fichiers de configuration).
  llm: openai/qwen-3.6-35b-instruct
  tools:
  - list_directory
  verbose: true
  allow_delegation: false
- name: Auditeur_Code
  role: Expert en audit de code source et cybersécurité
  goal: Lire uniquement les fichiers recommandés par l'explorateur, et lister toutes
    les vulnérabilités, bugs ou optimisations.
  backstory: Tu es un ingénieur logiciel extrêmement méticuleux. Tu reçois une liste
    de fichiers précis, tu lis leur contenu, et tu décèles les mauvaises pratiques
    de sécurité ou d'architecture.
  llm: openai/qwen-3.6-35b-instruct
  tools:
  - read_file
  verbose: true
  allow_delegation: false
- name: Lead_Tech_Redacteur
  role: Lead Développeur et Rédacteur technique
  goal: Compiler les retours de l'Auditeur en un rapport de Code Review propre et
    professionnel.
  backstory: Tu transformes des notes d'audit brutes en un rapport structuré en Markdown.
    Tu classes les retours par niveau de criticité (Critique, Mineur, Optimisation).
  llm: openai/qwen-3.6-35b-instruct
  tools:
  - write_file
  verbose: true
  allow_delegation: false
tasks:
- description: 'L''utilisateur a demandé d''auditer le dossier suivant : "{message}".

    1. Utilise ''list_directory'' sur le dossier racine ("{message}"). 2. Si tu vois
    des sous-dossiers prometteurs (backend, frontend, core), utilise à nouveau ''list_directory''
    sur ces chemins. 3. Ta mission est UNIQUEMENT de fournir la liste des 3 à 5 fichiers
    les plus importants à lire pour un audit de sécurité (ex: main.py, router, config...).
    4. Ne fournis que les chemins complets de ces fichiers. Ne choisis jamais de fichiers
    .log ou package-lock.json.

    '
  expected_output: 'Une liste précise des 3 à 5 chemins de fichiers critiques à auditer.

    '
  agent: Explorateur_Projet
- description: 'L''Explorateur a identifié les fichiers critiques.

    1. Utilise ton outil ''read_file'' pour lire le contenu de CHAQUE fichier identifié
    par l''Explorateur. 2. Analyse le code pour trouver des bugs, des failles de sécurité,
    ou proposer des optimisations. 3. Résume tes découvertes sous forme de notes claires
    pour chaque fichier audité.

    '
  expected_output: 'Un rapport d''audit brut contenant les problèmes identifiés fichier
    par fichier, prêt à être mis en forme.

    '
  agent: Auditeur_Code
- description: 'À partir du rapport d''audit brut, rédige la Review finale. Utilise
    ton outil ''write_file'' pour sauvegarder ce rapport dans le dossier "{message}"
    sous le nom ''CODE_REVIEW.md''.

    '
  expected_output: 'Un message confirmant que le fichier ''CODE_REVIEW.md'' a été
    créé avec succès, structuré par niveaux de criticité.

    '
  agent: Lead_Tech_Redacteur
