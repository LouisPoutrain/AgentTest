[theme]
# Primary accent color (Blue electric for buttons/focus)
primaryColor = "#2E66FF"

# Main background color (Dark deep)
backgroundColor = "#0E1117"

# Secondary background color (Slightly lighter for sidebar and elements)
secondaryBackgroundColor = "#161B22"

# Main text color
textColor = "#E6EDF3"

# Font (We must keep sans serif here as a fallback, 
# and we will override it via CSS for Inter/Space Grotesk)
font = "sans serif"
